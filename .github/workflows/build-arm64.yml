name: build-arm64-image

# Build the RAGFlow image for linux/arm64 on GitHub-hosted ARM64 runners.
#
# The Dockerfile selects its build-stage base image via TARGETARCH: on an
# arm64 runner TARGETARCH=arm64, so the build uses myfbee/github-runner:arm64
# (built from the github-runner-dockerfile for linux/arm64) and produces a
# native arm64 image. No --platform / QEMU emulation is required because the
# runner is already arm64.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'build.sh'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'

permissions:
  contents: read

jobs:
  build-arm64:
    # GitHub-provided ARM64 runner (native linux/arm64).
    runs-on: ubuntu-24.04-arm
    steps:
      # Fetch with full history + tags so the Dockerfile's `git describe` version
      # stamp (it bind-mounts .git at build time) resolves a real tag.
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: myfbee/ragflow:arm64
